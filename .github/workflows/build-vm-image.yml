# Rebuilds the image the PinChat prod VM runs (ECR imkit-authserver:5698e38e)
# from the same commit, so AKS can pull it from GHCR. Build-only branch: do not merge.
name: Build VM image

on:
  push:
    branches: [build/vm-5698e38e]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/imkit/imkit-auth-server:vm-5698e38e
